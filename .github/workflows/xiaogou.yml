# 小狗之心通知 App 的自动打包（2026-11-08 加）
# 推到 main，或在 Actions 页手动点「Run workflow」→ 编 F-Droid 版（不带任何谷歌组件）
# → 用宝宝自己的签名钥匙签名 → 签好的 xiaogou-notify.apk 挂在这次运行的 Artifacts 里（保留 30 天）。
# 需要两个仓库 Secrets：
#   XIAOGOU_KEYSTORE_B64  = 签名钥匙文件 xiaogou.p12 的 base64
#   XIAOGOU_KEYSTORE_PASS = 钥匙密码
# 钥匙原件在宝宝电脑 D:\我的工作助手\小狗之心通知App\签名钥匙\（以后更新必须用同一把，丢了就得卸载重装）
name: 打包小狗之心通知

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 编译 F-Droid 版（不带谷歌组件）
        run: ./gradlew --no-daemon assembleFdroidRelease

      - name: 用自己的钥匙签名
        env:
          KS_B64: ${{ secrets.XIAOGOU_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.XIAOGOU_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "没找到签名钥匙（仓库 Secrets 里要有 XIAOGOU_KEYSTORE_B64 和 XIAOGOU_KEYSTORE_PASS）"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/xiaogou.p12"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          IN="$(ls app/build/outputs/apk/fdroid/release/*.apk | head -1)"
          echo "build-tools: $BT"
          echo "未签名的包: $IN"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/xiaogou.p12" --ks-type PKCS12 --ks-pass env:KS_PASS \
            --ks-key-alias xiaogou --out xiaogou-notify.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs xiaogou-notify.apk
          rm -f "$RUNNER_TEMP/xiaogou.p12" "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: xiaogou-notify
          path: xiaogou-notify.apk
          retention-days: 30
